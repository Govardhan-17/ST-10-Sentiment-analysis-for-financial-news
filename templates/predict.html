<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis - Predict</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: #0d1117;
            color: #ffffff;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* Adding Dotted Background */
        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .container {
            position: relative;
            background: rgba(22, 27, 34, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            width: 90%;
            max-width: 500px;
        }
        h1 {
            font-size: 2em;
            text-shadow: 2px 2px 10px rgba(0, 255, 255, 0.5);
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 1em;
            border-radius: 10px;
            border: none;
            background: #0d1117;
            color: #ffffff;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.2);
            resize: none;
            outline: none;
        }
        .btn {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 1.2em;
            color: white;
            background: #ff9800;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.8);
        }
        .btn:hover {
            background: #e68900;
            box-shadow: 0 0 30px rgba(255, 152, 0, 1);
        }
    </style>
</head>
<body>
    <div class="background"></div> <!-- Dotted Background -->
    <div class="container">
        <h1>Enter Your Statement</h1>
        <form action="/predict" method="POST">
            <textarea name="message" placeholder="Type your message here..." required></textarea>
            <button type="submit" class="btn">Analyze Sentiment</button>
        </form>
    </div>
</body>
</html>
