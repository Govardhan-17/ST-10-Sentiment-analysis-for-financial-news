<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <style>
        body {
            background: linear-gradient(45deg, #1e3c72, #2a5298, #ff6a00);
            background-size: 400% 400%;
            animation: gradientAnimation 10s infinite alternate;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            color: white;
        }
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            text-align: center;
            width: 500px;
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #444;
            border: 2px solid #ff6a00;
            color: white;
            padding: 12px;
            border-radius: 8px;
            resize: none;
            font-size: 16px;
            transition: border-color 0.3s ease-in-out;
        }
        textarea:focus {
            border-color: #ff4081;
        }
        button {
            background: linear-gradient(45deg, #ff4081, #ff6a00);
            border: none;
            padding: 12px 25px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
        }
        .result {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #ff6a00;
            animation: glow 1.5s infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 5px #ff4081; }
            to { text-shadow: 0 0 15px #ff6a00; }
        }
        .icon {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
            animation: bounce 1.5s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0px); }
            to { transform: translateY(-10px); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <img src="https://cdn-icons-png.flaticon.com/512/3318/3318580.png" alt="Sentiment Analysis" class="icon">
        <h2>Sentiment Analysis</h2>
        <form action="/predict" method="post">
            <textarea name="message" placeholder="Enter your message..."></textarea>
            <br>
            <button type="submit">Analyze Sentiment</button>
        </form>
        <div class="result">Your sentiment result will appear here!</div>
    </div>
</body>
</html>
