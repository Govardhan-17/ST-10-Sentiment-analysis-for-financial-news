<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Sentiment Analysis</title>
  <style>
    /* Global Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      color: #fff;
      overflow: hidden;
    }

    /* Container for the content */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Heading */
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
    }

    /* Paragraph */
    p {
      font-size: 1.2rem;
      max-width: 600px;
      text-align: center;
      margin-bottom: 40px;
      line-height: 1.6;
      color: #ccc;
    }

    /* Predict Sentiment Button */
    .predict-btn {
      padding: 15px 30px;
      font-size: 1.2rem;
      color: #fff;
      background: linear-gradient(135deg, #ff6f61, #ff3b2f);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 111, 97, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .predict-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(255, 111, 97, 0.6);
    }

    /* Flying Paper Money Animation */
    @keyframes fly {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-1000px) rotate(720deg);
        opacity: 0;
      }
    }

    .money {
      position: absolute;
      font-size: 2rem;
      color: #ffd700;
      animation: fly 5s linear infinite;
      user-select: none;
    }

    /* Dark Theme Adjustments */
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 10%, transparent 10.01%);
      background-size: 20px 20px;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Financial Sentiment Analysis</h1>
    <p>
      Welcome to the future of financial analysis! Our cutting-edge sentiment analysis tool helps you predict market trends by analyzing the sentiment behind financial news, social media, and more. Stay ahead of the curve with actionable insights.
    </p>
    <button class="predict-btn" onclick="redirectToPredict()">Predict Sentiment</button>

    <!-- Flying Paper Money -->
    <div class="money" style="top: 10%; left: 5%;">💵</div>
    <div class="money" style="top: 20%; left: 20%;">💷</div>
    <div class="money" style="top: 30%; left: 35%;">💴</div>
    <div class="money" style="top: 40%; left: 50%;">💶</div>
    <div class="money" style="top: 50%; left: 65%;">💵</div>
    <div class="money" style="top: 60%; left: 80%;">💷</div>
    <div class="money" style="top: 70%; left: 95%;">💴</div>
  </div>

  <script>
    // Function to redirect to /predict
    function redirectToPredict() {
      window.location.href = "/predict";
    }

    // Generate more flying money dynamically
    const container = document.querySelector('.container');
    for (let i = 0; i < 20; i++) {
      const money = document.createElement('div');
      money.classList.add('money');
      money.innerHTML = '💵';
      money.style.top = `${Math.random() * 100}%`;
      money.style.left = `${Math.random() * 100}%`;
      money.style.animationDuration = `${Math.random() * 3 + 2}s`;
      container.appendChild(money);
    }
  </script>
</body>
</html>
