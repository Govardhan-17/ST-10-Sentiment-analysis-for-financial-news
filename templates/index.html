<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis for Financial News</title>
    <style>
        body {
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            padding: 20px;
            animation: slideIn 1.5s ease-in-out;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        #predict-btn {
            background-color: #ffcc00;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
        }

        #predict-btn:hover {
            transform: scale(1.1);
        }

        .news-image {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            display: block;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sentiment Analysis for Financial News</h1>
        </header>
        <section class="news-section">
            <h2>Latest Financial News</h2>
            <img src="financial-news.jpg" alt="Financial News" class="news-image">
            <p id="news-content">Fetching the latest financial news...</p>
        </section>
        <button id="predict-btn">Predict Sentiment</button>
        <div id="result" class="hidden"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const predictButton = document.getElementById("predict-btn");

            if (predictButton) {
                predictButton.addEventListener("click", function () {
                    window.location.href = "/predict";
 // Redirects to /predict
                });
            } else {
                console.error("Predict button not found!");
            }
        });
    </script>
</body>
</html>
